age, and two inputs that now fail: a plan with NaN, which is not JSON, and a manifest plan whose selection is not a list; an XML declaration after the start of a document now fails, as in Python; Go 100% of statements); scripts/check_dotnet_release_artifacts.py and scripts/check_nuget_public_artifacts.py on 2026-10-24 (1,129 lines; the installed-package smoke scripts read content digests from the verifier; 5,047 runs against the Python scripts on real packed packages, mutated archives, nuspecs, projects, selections, and registry responses, and 4,000 random bit flips in packages gave identical exit codes, output, and files, except usage text, Python tracebacks, and inputs that now fail: a version with non-ASCII digits, a nuspec that is not UTF-8 or declares entities, registry JSON with NaN or in UTF-16, and LZMA or ZIP64 archives; a missing manifest folder is now created, and a failed public check no longer leaves a temporary folder; Go 100% of statements); scripts/check_python_release_artifacts.py on 2026-10-24 (922 lines; 8,500 runs against the Python script on real built wheels and source archives, mutated archives, metadata, manifests, selections, and source dates, and 7,500 runs of the public URL, PyPI response, and content digest checks gave identical exit codes, output, and files, and resolve-public against PyPI wrote identical files, except usage text, Python tracebacks, and inputs that now fail: GNU sparse tar members, LZMA wheel members, PyPI JSON with NaN or not in UTF-8, and file URLs with characters that need escaping; normalized source archives hold a byte-identical tar stream, but the gzip bytes differ from Python, so a source archive of an earlier release now reconciles as existing; Python 74% of branches, Go 100% of statements); scripts/create_native_release_artifact_manifest.py and its five native_release_artifact_*.py readers on 2026-10-24 (2,481 lines; 10,800 runs against the Python scripts on generated dSYM bundles and archives, ProGuard mappings, ELF, Breakpad, PE, PDB, and Unity symbols, directories, and ZIP archives, each mutated, truncated, or limited, gave identical exit codes and output, except usage text, Python tracebacks, the decompression reason for a corrupt embedded Portable PDB, and a ZIP member whose local name is not UTF-8, which now exits 1 instead of 2; a dSYM directory whose name does not end in .dSYM and a ZIP archive that needs a newer ZIP version now give a blocked manifest instead of a traceback; Go 100% of statements); scripts/check_registry_publication.py on 2026-10-24 (838 lines; 6,000 runs against the Python script on generated options, Maven release plans, fake go commands, and registry responses (status codes, transport errors, bodies that are not UTF-8 or JSON, and mutated npm, provenance, PyPI, RubyGems, NuGet, Packagist, crates.io index, OpenUPM, and Maven metadata payloads) gave identical exit codes and output, except usage text, Python tracebacks, the reason after a failed read, -h after an invalid option value, which now prints help, and registry JSON with NaN, which now fails; abbreviated option names are no longer accepted, a zero timeout fails each request, and a certificate error no longer retries through curl; protected release jobs build the verifier from the protected checkout without a cache; Go 100% of statements); scripts/prepare_js_release_artifact_debug_ids.py, scripts/create_js_release_artifact_manifest.py, scripts/verify_js_release_artifact_symbolication.py, and scripts/js_release_artifact_fake_intake.py on 2026-10-24 (1,119 lines; differences: usage text, Python tracebacks, no parser message after \"is not valid JSON\", a message naming the file for a source map or manifest that is not UTF-8, one message for every invalid bracketed URL host, and the fake intake writes its state without spaces; inputs that now fail: source maps with NaN, Infinity, or unpaired surrogate escapes, which are not JSON, and a source map number beyond the float range, which now stops