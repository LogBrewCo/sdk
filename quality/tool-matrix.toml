# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); the Contract checks job runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-10-05. Every run starts
# from a fresh runner. p99 needs 100 runs; below that an entry gives the run count
# and the maximum ("push" and "pull request" runs).
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment). A `commands` entry ending in *
# covers every command that starts with it.

gates = ["scripts/check_go_static.sh", "scripts/check_java_static.sh", "scripts/check_js_lint.sh", "scripts/check_kotlin_style.sh", "scripts/check_php_static.sh", "scripts/check_public_sdks.sh", "scripts/check_python_static.sh", "scripts/check_rust_static.sh", "scripts/check_shell_static.sh", "scripts/check_swift_style.sh"]
utilities = ["[", "[[", "awk", "basename", "bash", "break", "cat", "cd", "chmod", "command", "continue", "curl", "date", "dirname", "echo", "exit", "export", "find", "git", "grep", "kill", "local", "mapfile", "mkdir", "mktemp", "mv", "printf", "read", "rm", "rmdir", "set", "sha256sum", "shasum", "shift", "sleep", "sort", "sudo", "tail", "tar", "tr", "trap", "true", "umask", "uname", "unzip", "wait", "xargs", "redis-cli", "brew", "fetch_java_*", "python_package_version", "run_native_verifier", "sed"]

[[tool]]
id = "ruff"
risk = "Python lint and formatting"
tool = "Ruff (native Rust)"
version = "0.15.15"
pins = ["scripts/python_static_tools.txt::ruff==@VERSION@"]
commands = ["scripts/check_python_static.sh"]
runs_in = "CI Contract checks: Run Python static analysis"
config = "pyproject settings in each Python package"
conflicts = "none known"
exceptions = "none"
runtime = "with mypy: push n=6, max 33 s; pull request n=9, max 36 s"
findings = "unknown: findings are fixed before merge"
replaces = "none"
status = "behind: 0.17.1 released 2026-10-15"
checked = 2026-10-19

[[tool]]
id = "rust"
risk = "Rust SDK compile errors, compiler lints, and test failures"
tool = "rustc, cargo, and libtest"
version = "the channel in rust-toolchain.toml (1.99.1 on 2026-10-23); Dependabot proposes each new stable release"
pins = ["rust-toolchain.toml::channel = \"", ".github/dependabot.yml::package-ecosystem: rust-toolchain"]
uses = ["rust-lang/crates-io-auth-action"]
commands = ["cargo test", "cargo publish", "rustup"]
runs_in = "CI Rust jobs; publish workflows"
config = "rust/*/Cargo.toml"
conflicts = "none known"
exceptions = "none"
runtime = "see clippy (the static step builds every target)"
findings = "unknown: failures are fixed before merge and not recorded"
replaces = "none"
checked = 2026-10-23

[[tool]]
id = "clippy-rustfmt"
risk = "Rust lints, docs, and formatting drift"
tool = "Clippy, rustdoc, and rustfmt"
version = "the rust toolchain (rust-toolchain.toml installs clippy and rustfmt with it)"
pins = ["rust-toolchain.toml::components = [\"clippy\", \"rustfmt\"]", "scripts/check_rust_static.sh::cargo clippy --all-targets --all-features -- -D warnings"]
commands = ["cargo clippy", "cargo doc", "cargo fmt", "scripts/check_rust_static.sh"]
runs_in = "CI Contract checks: Run Rust static analysis"
config = "rust/logbrew/Cargo.toml [lints] denies every rustc lint group and opt-in lint, every rustdoc lint, the Clippy all, cargo, nursery, and pedantic groups, and every Clippy restriction lint not listed below, and forbids unsafe code; rust/logbrew/clippy.toml sets the thresholds and item ordering. The script checks no features, all features, and each feature alone, unused dependencies of the library, and the docs"
conflicts = "one side of each pair stays off: implicit_return (needless_return), question_mark_used (question_mark), semicolon_outside_block (semicolon_inside_block), pub_with_shorthand (pub_without_shorthand), separated_literal_suffix (unseparated_literal_suffix), self_named_module_files (mod_module_files), ref_patterns (pattern_type_mismatch), single_call_fn (too_many_lines and cognitive_complexity), redundant_pub_crate (unreachable_pub), big_endian_bytes (host_endian_bytes and little_endian_bytes; network byte order stays available), missing_docs_in_private_items (only public API items carry doc comments). Struct field ordering is off because serde writes JSON fields in declaration order. unused_crate_dependencies runs on the library alone, since each test and example uses part of the dev-dependencies"
exceptions = "exhaustive_structs, exhaustive_enums, and pub_use are off because non_exhaustive public types or public modules in place of re-exports would break callers; max-struct-bools = 5 because the public DeliveryHealthSnapshot has 5 flags; missing_trait_methods is off because it would copy every provided method of the tracing and tower traits; linker_info is off because it turns linker notes about prebuilt dependency objects into errors; serde_json::Value is not a disallowed type because it is the public metadata and event attribute type; tests may unwrap, expect, panic, print, and index (clippy.toml allow-*-in-tests)"
runtime = "push n=1, max 50 s; pull request n=2, max 51 s (before the feature runs); local 2026-10-30 with the feature runs: 40 s after an edit, 3 s unchanged"
findings = "2026-10-30: 3,725 findings with all features, 189 of them struct field order, now off; 0 remain, with no allow attributes"
replaces = "none"
checked = 2026-10-30

[[tool]]
id = "mypy"
risk = "Python type errors"
tool = "mypy"
version = "2.1.0"
pins = ["scripts/python_static_tools.txt::mypy==@VERSION@"]
commands = ["scripts/check_python_static.sh"]
runs_in = "CI Contract checks: Run Python static analysis"
config = "pyproject settings in each Python package"
conflicts = "a Python tool, not native; a native type checker with equal coverage would replace it"
exceptions = "none"
runtime = "with ruff (see ruff)"
findings = "unknown: findings are fixed before merge"
replaces = "none"
status = "behind: 2.4.0 released"
checked = 2026-10-19

[[tool]]
id = "oxlint"
risk = "JavaScript and TypeScript lint"
tool = "oxlint (native Rust)"
version = "1.90.0"
pins = ["scripts/check_js_lint.sh::oxlint_version=\"@VERSION@\""]
commands = ["scripts/check_js_lint.sh"]
runs_in = "CI Contract checks: Run JavaScript lint (when JavaScript changed)"
config = "two passes over all JavaScript: the oxlintrc.json the script writes (ESLint recommended plus the strict set), and a type-aware pass that enables typescript/consistent-return and fails on TypeScript TS2683 (noImplicitThis, Oxlint's no-invalid-this replacement) and TS1108 (a top-level return, the one syntax error the parse misses). The strict pass lints every package that joined the strict gate (see typescript-native) with js/.oxlintrc.json: every category including nursery, the eslint, typescript, unicorn, oxc, import, jsdoc, promise, and node plugins, type-aware rules, warnings denied, unused disable directives reported. The react, react-perf, jsx-a11y, vue, nextjs, jest, and vitest plugins are not loaded because no joined package uses those frameworks; a package that does adds its plugin when it joins. Rule options chosen, not disabled: func-style declaration (ECMAScript function declarations, the repository convention), one-var never (the convention the first pass enforces on all JavaScript), consistent-type-definitions type (published declarations keep type aliases; interfaces would change what consumers can assign, because interfaces have no implicit index signature), max-lines skipComments (JSDoc type annotations, which TypeScript source writes inline, do not count), no-redeclare without builtin globals (as in the first pass), no-misused-spread allowing strings (see conflicts), sort-keys allowLineSeparatedGroups (a blank line starts a new sorted group, so an object the SDK sends or returns keeps the member order its published payload already has; the browser real-user smoke compares issue stack frames as serialized JSON), no-void allowAsStatement (a void statement marks a promise that is deliberately not awaited, which typescript/no-floating-promises accepts; void inside an expression stays banned), and no-unused-vars ignoreRestSiblings in both passes (an object rest that leaves one member out names that member without reading it, which the compiler's noUnusedLocals also accepts; Oxlint's default underscore patterns for arguments and variables are restated, because setting any option drops them)"
conflicts = "checkJs reports thousands of TypeScript diagnostics on the packages that have not joined the strict gate; the type-aware pass ignores them. Conflicting pairs, each settled for the rule that matches the language convention and the other enabled rules: eslint/no-ternary off (unicorn/prefer-ternary and no-nested-ternary kept), eslint/no-undefined off (unicorn/no-null kept), oxc/no-optional-chaining off (typescript/prefer-optional-chain kept), oxc/no-async-await off (async and await kept), oxc/no-rest-spread-properties off (spread kept); unicorn/no-useless-undefined off, because a function that returns T or undefined must then end in a bare return or no return, which typescript/consistent-return, eslint/no-useless-return, and the compiler's noImplicitReturns reject (seeded 2026-10-30); eslint/require-await off, the base rule that typescript/require-await extends, which flags an async function that returns another promise while typescript/promise-function-async requires that function to be async; node/no-top-level-await off, because with typescript/no-floating-promises, eslint/no-void, and promise/prefer-await-to-then on, top-level await is the only way a module entry runs async work; import/no-named-export and import/prefer-default-export off, because every exporting module breaks either them or import/no-default-export, and named exports are the ECMAScript module convention; jsdoc/require-param-description, require-property-description, and require-returns-description off, because comments that repeat what names and types already say are not kept (the same decision as missing_docs_in_private_items in the Rust lint table); typescript/require-await off, because a function that must return a promise but has no async work, such as a stub transport, has no form that passes it, typescript/promise-function-async, and unicorn/no-useless-promise-resolve-reject together (seeded 2026-10-31: an async function without await fails the first, a plain function that returns Promise.resolve fails the second, and an async function that returns Promise.resolve fails the third); typescript/no-misused-spread allows the string type (its allow option), because unicorn/prefer-spread rejects Array.from(text) and no-misused-spread rejects [...text], so code that bounds or scans text by code point had no accepted form (seeded 2026-10-31 in @logbrew/sdk issue stack frames); spreading every other type stays an error"
exceptions = "external contracts, scoped by file or type in js/.oxlintrc.json: import/no-commonjs, import/unambiguous, typescript/no-require-imports, and typescript/no-var-requires off in the joined packages' CommonJS files (the builds that package.json main and exports.require load) and in @logbrew/express's test/commonjs.cjs, which loads the package through require to test its CommonJS build; import/no-default-export off in each published entry (index.js, index.cjs, index.d.ts, index.d.cts), whose API includes a default export object, and in the @logbrew/sdk/vite-release-artifacts entry (vite-release-artifacts.js, .d.ts, .d.cts), whose default export is the plugin factory that Vite configurations import; import/no-nodejs-modules off in @logbrew/amqplib, @logbrew/express, @logbrew/fastify, @logbrew/kafkajs, and @logbrew/nestjs, which only run on Node.js (browser packages keep it), and in the @logbrew/sdk release-artifact files (the logbrew-release-artifacts command, its modules, the build-time helper, the Vite plugin's CommonJS files, and their tests), which run only in Node.js and Bun at build time and which no browser or React Native entry imports; node/no-sync off in release-artifacts-build.cjs, whose runReleaseArtifactCli runs the command with spawnSync because @logbrew/next and @logbrew/react-native call it synchronously and read its result, and in vite-release-artifacts-config.cjs, which reads the installed vite/package.json inside the plugin's config hook, a synchronous hook; unicorn/no-null off in release-artifacts-manifest-artifact.js, because the published manifest format writes sourceMap: null for an artifact without a source map, and in vite-release-artifacts-config.cjs and test/release-artifacts-vite.test.js, because the plugin's config hook returns null when the Vite configuration needs no change, as its declaration states and the test asserts; node/no-process-env off in release-artifacts-upload.js, which reads the upload token from the variable that --token-env names; import/no-nodejs-modules and node/no-process-env off in tools/npm-publish, the release script that no package ships, which reads GitHub's OIDC request variables, and eslint/no-await-in-loop off there, because it publishes packages one at a time in the order given, so that a package never appears on npm before the LogBrew packages it depends on; import/no-nodejs-modules off in the benchmark .mjs files, which only run in Node.js (the browser bundles import only the .js adapters, the loop, the page, and the field readers); eslint/no-await-in-loop off in benchmarks, whose events, runs, and polls must run one after another so that no measurement overlaps another; node/no-process-env off in benchmarks/latency.mjs and benchmarks/overhead/cdp.mjs, which read their documented inputs (LOGBREW_API_URL, the two key file variables, and CHROME_PATH); eslint/sort-imports, import/no-namespace, and eslint/require-unicode-regexp off in benchmarks/size, whose two setups copy each SDK's documented code and whose published sizes depend on their exact imports and import order (measured 2026-10-31: following those rules moved the gzip sizes by up to 22 bytes); max-params 6 in the @logbrew/amqplib entry files, whose published publish and sendToQueue helpers take amqplib's own arguments plus the channel and options; max-params 4 in the @logbrew/aws-sqs entry files, whose published helpers take the AWS SDK client, the command class, the command input, and the options, and in @logbrew/nestjs's declarations and logger.cjs, whose published logger idFactory option receives the level, the message, the context, and the sequence number, in @logbrew/express's index.cjs and index.d.ts, whose error middleware takes Express's four error-handler parameters and whose handler type declares this plus Express's three handler parameters, and in its test support module and real-user smoke example, which define Express error middleware; unicorn/no-null off in @logbrew/nestjs's logger.cjs, whose published flush and shutdown resolve null after a failed delivery; the NestJS examples define controllers and modules as classes and decorate them by calling NestJS's decorator factories, so there eslint/class-methods-use-this exempts the route handler methods auto, fail, and logbrew, eslint/max-classes-per-file allows 4, eslint/new-cap exempts Controller, Get, Module, and Req, typescript/no-extraneous-class allows the empty module classes, and import/no-unassigned-import allows reflect-metadata, which NestJS needs loaded first; max-params 5 in the @logbrew/bullmq entry files, whose published bullMqQueueAddWithLogBrewSpan takes BullMQ's own add arguments (name, data, and job options) plus the queue and the options; typescript/no-unnecessary-type-parameters off in the @logbrew/bullmq declarations, whose published instrumentLogBrewBullMqProcessor overloads keep a Target type parameter that callers may pass explicitly; typescript/prefer-readonly-parameter-types allows Buffer and its NonSharedBuffer alias from @types/node (no readonly Buffer type exists), amqplib ConsumeMessage (handed back to channel.ack and channel.nack, which take amqplib's mutable Message), the KafkaJS ProducerRecord, ProducerBatch, TopicMessages, EachMessagePayload, and EachBatchPayload types that the helpers take from and hand back to KafkaJS, and the packages' own option types, which carry LogBrewClient and arrays into @logbrew/node's queue helpers, whose published declarations take them mutable (re-check when @logbrew/node joins); PackageJson from @npm/types, which the npm publisher hands to libnpmpublish's publish; and IncomingMessage and ServerResponse from @types/node, the DOM MessageEvent, and the fetch Response, platform objects with no readonly form; node/no-process-env off in the two README examples of each package, which read the server API key and broker address from the environment so that no key sits in code, and in the internal.cjs of @logbrew/express, @logbrew/fastify, and @logbrew/nestjs, which reads the documented LOGBREW_SERVER_API_KEY and LOGBREW_API_KEY fallbacks; typescript/consistent-type-definitions off in the index.d.ts of @logbrew/fastify, whose declare module block adds request.logbrew to Fastify's FastifyRequest, and of @logbrew/express and @logbrew/nestjs, whose declare global blocks add it to Express's Request, because only an interface merges into another interface; oxc/no-async-endpoint-handlers off in the @logbrew/fastify examples, because Fastify awaits an async route handler and sends its rejection to the error handler (the rule guards Express, which does neither); typescript/prefer-readonly-parameter-types also allows Fastify's FastifyInstance, FastifyRequest, and FastifyReply and FastifyError from @fastify/error, which Fastify hands to hooks and plugins and decorates in place, LogBrewClient, RecordingTransport, Transport, and SpanLinkSummary from @logbrew/sdk (classes, a method type, and a link type with mutable metadata that @logbrew/node's queue helpers take; re-check when @logbrew/sdk publishes readonly members), @logbrew/fastify's own client and plugin option types, the AWS SDK Message and SendMessage, SendMessageBatch, and ReceiveMessage command inputs that the @logbrew/aws-sqs helpers take from and hand back to the AWS SDK, @logbrew/aws-sqs's own option types and the SQS client it instruments in place, BullMQ's FlowJob, FlowOpts, and Job, which the @logbrew/bullmq helpers take from and hand back to BullMQ, @logbrew/bullmq's own option and bulk job types, LogBrewTraceContext from @logbrew/node (published with mutable fields), AbortSignal from @types/node, a platform object, NestJS's ExecutionContext and CallHandler, Express's Request and Response, and the rxjs Subscriber, which NestJS hands to interceptors and which the interceptor hands on unchanged, @logbrew/nestjs's own client, interceptor, and logger option types, Express's NextFunction, which Express hands to middleware, TestContext from node:test, which the test runner hands to each test, and @logbrew/express's own client and option types; unicorn/no-null off in @logbrew/sdk's null-value.cjs, the one module that holds the null the published API returns (RecordingTransport.lastBody and the console, Pino, Winston, and OpenTelemetry flush results); import/no-nodejs-modules and promise/prefer-await-to-callbacks off in @logbrew/sdk's winston.cjs, whose Winston transport has to be a Node.js Writable stream that Winston pipes records into and whose write(chunk, encoding, callback) and log(info, callback) Node.js and Winston call with a callback (the browser and React Native entries never load it); eslint/new-cap exempts Router in @logbrew/express's mounted-route test helper, which builds routers with express.Router() as Express documents; unicorn/no-thenable off in @logbrew/express's test support module, whose thenable stands in for the PromiseLike results that withLogBrewExpressHandler accepts from handlers; node/callback-return and promise/prefer-await-to-callbacks off in @logbrew/express's error middleware and handler wrapper unit tests, which call Express's next before more work or from a deferred callback, or pass a function in its place, to test those paths of the middleware contract. Each is re-checked at every Oxlint upgrade"
runtime = "push n=1, max 1 s; pull request n=1, max 0 s; local 2026-10-23 with the type-aware pass: 2.7 s including downloads; the replaced per-file node --check took 16.7 s for 274 files. Local 2026-10-30 with the strict pass on one package: see typescript-native"
findings = "2026-10-23: consistent-return 0, no-invalid-this 54 (wrappers that read this without a JSDoc @this tag); a seeded example of each must fail on every run. Syntax: on 17 seeded syntax errors the Oxlint parse plus TS1108 reported all 17, the same as node --check. 2026-10-30 strict pass, @logbrew/amqplib before its fixes: 395 findings, led by no-use-before-define 62, the no-unsafe rules 136 (values typed any because nothing was typed), strict-boolean-expressions 28, and exports-last and group-exports 32; a seeded unchecked type assertion must fail on every run"
replaces = "scripts/check_js_sources.py (node --check on each JavaScript file, local check only)"
checked = 2026-10-31

[[tool]]
id = "tsgolint"
risk = "type information for Oxlint's type-aware rules"
tool = "tsgolint (native Go, TypeScript 7 checker)"
version = "7.0.2005"
pins = ["scripts/check_js_lint.sh::tsgolint_version=\"@VERSION@\""]
commands = ["scripts/check_js_lint.sh"]
runs_in = "CI Contract checks: Run JavaScript lint (when JavaScript changed)"
config = "a temporary js/tsconfig.json with allowJs, checkJs, and noImplicitThis for the first type-aware pass; the joined packages' own strict tsconfig.json for the strict pass; the npm registry tarball is verified against a pinned SHA-256. Oxlint 1.90.0 requires tsgolint 7.0.2005 or later"
conflicts = "none known"
exceptions = "none"
runtime = "see oxlint"
findings = "see oxlint"
replaces = "none"
checked = 2026-10-30

[[tool]]
id = "typescript-native"
risk = "JavaScript type errors, implicit and explicit any, unchecked assertions, suppression and prose comments, and declaration drift in the @logbrew packages that joined the strict gate"
tool = "TypeScript native compiler (tsc 7, Go)"
version = "7.0.2"
pins = ["scripts/check_js_lint.sh::typescript_version=\"@VERSION@\"", "js/package.json::\"@types/node\": \"26.6.6\"", "js/package.json::\"fastify\": \"5.12.7\"", "js/package.json::\"@aws-sdk/client-sqs\": \"3.1161.0\"", "js/package.json::\"bullmq\": \"6.5.2\"", "js/package.json::\"@types/bun\": \"1.3.14\"", "benchmarks/package.json::\"@types/node\": \"26.6.6\"", "tools/npm-publish/package.json::\"@types/bun\": \"1.3.14\"", "js/package.json::\"prisma\": \"7.10.1\"", "js/package.json::\"@prisma/client\": \"7.10.1\"", "js/package.json::\"@nestjs/common\": \"12.1.3\"", "js/package.json::\"@nestjs/core\": \"12.1.3\"", "js/package.json::\"@types/express\": \"5.0.6\"", "js/package.json::\"reflect-metadata\": \"0.2.2\"", "js/package.json::\"rxjs\": \"7.8.2\"", "js/package.json::\"express\": \"5.3.0\""]
commands = ["scripts/check_js_lint.sh", "bun js/node_modules/.bin/prisma"]
runs_in = "CI Contract checks: Run JavaScript lint (when JavaScript changed)"
config = "js/tsconfig.base.json: strict plus noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, noPropertyAccessFromIndexSignature, noImplicitReturns, noFallthroughCasesInSwitch, noUnusedLocals, noUnusedParameters, allowUnreachableCode and allowUnusedLabels false, noUncheckedSideEffectImports, isolatedModules, verbatimModuleSyntax, erasableSyntaxOnly, libReplacement false, skipLibCheck false, and checkJs, with lib es2022 for the Node 18 floor. A project joins with a tsconfig.json that extends it and names its entry files, declarations included, in files: a wildcard include drops a JavaScript file whose declaration of the same name it also matches, and a declaration outside the program is linted without the project's paths, so its imports from other LogBrew packages read as error types; its JavaScript is typed with JSDoc against the package's own declarations, and every JavaScript and TypeScript file under it, tests, examples, and scripts included, must be in the program. Every JavaScript or TypeScript file in the repository must sit in a joined project or a `pending` entry, so nothing stays outside the check once `pending` is empty. Typed peers come from js/package.json and js/bun.lock (frozen install); a joined project outside js with its own bun.lock (benchmarks, tools/npm-publish) installs from it, @types/bun matches the pinned Bun, and the benchmarks set lib es2024 and dom (they need Node.js 22 and run in Chrome) and drop the path map, so that they type-check against the installed packages they measure. skipLibCheck stays false: a dependency whose own types fail is upgraded, patched through Bun patchedDependencies recorded here, or replaced, never skipped. A joined package that holds prisma/schema.prisma gets its Prisma client generated before the type check (prisma generate from js/node_modules, telemetry off), so its examples type against a real client. The same gate fails on suppression comments (eslint-disable, oxlint-disable, @ts-ignore, @ts-expect-error, @ts-nocheck), on any, *, or ? in a JSDoc type, and on comment text other than JSDoc type tags outside declaration files; a seeded example of each, plus an implicit any, must fail on every run"
conflicts = "none known"
exceptions = "none; `pending` is the rollout order, not an exclusion: it lists the packages and script folders that have not joined yet, the gate fails on a stale entry, and the work ends with it empty. One dependency is patched: thread-stream 4.2.0 (pulled in by fastify through pino) names worker_threads.TransferListItem, which @types/node 26 removed; js/patches/thread-stream@4.2.0.patch names Transferable, the type that replaced it. Remove the patch when thread-stream ships the fix"
pending = ["js/logbrew-angular", "js/logbrew-browser", "js/logbrew-js", "js/logbrew-next", "js/logbrew-node", "js/logbrew-react", "js/logbrew-react-native", "js/logbrew-svelte", "js/logbrew-vue"]
runtime = "local 2026-10-31, the whole script with both strict packages: 20 s, almost all of it the three verified downloads; prisma generate 0.4 s warm and 0.7 s cold; the strict pass alone: tsc 0.13 s and the type-aware Oxlint pass 0.5 s per package"
findings = "2026-10-30, every JavaScript file checked under the strict options (a count that includes both index.js and index.d.ts in one program drops index.js, because the compiler keeps only the declaration file of the same name, which hid most errors in earlier counts): @logbrew/amqplib 72 errors in its source and 12 in its examples before it joined; @logbrew/kafkajs 130 in its source, 1 in its declarations, and 19 in its examples before it joined, which included README examples that pass release and environment to LogBrewClient.create and a smoke producer whose results lacked errorCode. They included README examples that pass release and environment to LogBrewClient.create, which ignores both, an example handler called with an argument it does not take, and declarations that rejected amqplib's own ConsumeMessage. 2026-10-31, before they joined: benchmarks 115 type errors and 469 lint findings, and tools/npm-publish 4 type errors and 52 lint findings. Pending packages, errors in source, declarations, and tests with examples: angular 195, 56, 19; aws-sqs 200, 1, 17 (it joined 2026-10-31 after 1,158 strict lint findings led by no-use-before-define 252 and no-unsafe-member-access 216; typing it found that the README example passed release and environment to LogBrewClient.create, which ignores both, and that the client parameter rejected a mock whose send does not take every AWS SDK command type); bullmq 144, 1, 86 (it joined 2026-10-31 after 802 strict lint findings led by no-unsafe-member-access 149 and no-unsafe-assignment 129; typing it found that the declarations rejected the README's own producer and worker code: a plain new Queue(\"orders\") passed to the add and addBulk helpers, because the queue types went through BullMQ's conditional Queue generics, and the wrapped processor passed to new Worker, whose processor must return a promise); express 118, 6, 298 (112, 0, 288 when it joined on 2026-10-31, with 1,580 strict lint findings led by no-unsafe-member-access 362 and no-unsafe-call 173; typing it found that the error handler passed the error and the request to its idFactory option while the declarations typed it as the request and the response, that the declarations rejected the plain request objects the event helpers accept, and that the CommonJS build lacked the default export its declarations promised); fastify 95, 1, 25 (116 when it joined on 2026-10-31, with 288 strict lint findings led by prefer-readonly-parameter-types 93 and no-magic-numbers 32; typing it found that error events passed the error and the request to the request event idFactory option, and that the declarations rejected the plain request object its real-user smoke example passes to createErrorEvent); nestjs 146, 8, 35 (159 with its examples typed against NestJS 12 and Express 5 when it joined on 2026-10-31, with 720 strict lint findings led by no-unsafe-assignment 135; typing it found that error events passed the error and the request to the request event idFactory option, as in @logbrew/fastify, that the declarations rejected the request trace the interceptor hands to requestEvent and errorEvent when passed back to createRequestEvent and createErrorEvent under exactOptionalPropertyTypes, and that its request context type had to stay identical to @logbrew/node's, because Express's Request extends both IncomingMessage and Express.Request and each declares logbrew); next 350, 2, 29; prisma 19, 0, 5 (its examples import a generated Prisma client; it joined 2026-10-31 with a test schema of one model); react 405, 29, 18; svelte 200, 26, 28; vue 263, 123, 159; sdk 1,047, 0, 550; node 1,069, 0, 386; browser 1,790, 52, 565; react-native 1,007, 2, 1,055. 2026-10-31, JSDoc in JavaScript against TypeScript source for @logbrew/sdk, measured on trace-context.cjs typed to zero: JSDoc took 395 lines (252 of code) with no build, and the published file is the checked file. TypeScript source took 285 lines, but under verbatimModuleSyntax and erasableSyntaxOnly the compiler cannot write a CommonJS module (TS1286 on every import and export; import = require is not erasable), and Bun bundling ESM source to CommonJS added 37 lines of bundler helpers per file and turned the exports into getters with an __esModule marker, which changes the published files. It would also need a build before the 102 scripts, workflows, tools, and tests that use the package folder directly, and generated JavaScript outside the type check. JSDoc is the cheaper path; the old and new builds, ESM and CommonJS, source and packed, gave the same results on 2,527 generated calls, and the released @logbrew/node 0.1.22, @logbrew/browser 0.1.16, and @logbrew/react-native 0.1.39 examples gave the same output on both"
