[[tool]]
id = "native-verifier"
risk = "invalid event batches and package JSON; broken local Markdown links; incomplete backend contract reports; build output left in the working tree; CI skipping a language job or Python unit test a change needs; publishing without branch protection or a protected release environment; non-public context, access values, or local paths in public files; package metadata, release workflows, or release docs that drift from the release catalog"
tool = "native SDK verifier (tools/toolchain-probe, Go); it replaces the Python repository checks one family at a time"
version = "repository"
unpinned = "built from this repository with the Go version in tools/toolchain-probe/.go-version"
commands = ["run_native_verifier"]
runs_in = "CI Contract checks; package and smoke scripts; release readiness"
config = "tools/toolchain-probe"
conflicts = "none known"
exceptions = "none"
runtime = "markdown-links, local 2026-10-23, 5 runs each: Go 0.02-0.03 s, Python 0.09-0.19 s; backend-reports: Go 0.00-0.01 s, Python 0.05-0.07 s; generated-artifacts: Go 0.02-0.03 s, Python 0.10-0.16 s; ci-select: Go 0.00-0.01 s, Python 0.04-0.05 s for both selectors, but the CI selection job takes 20-24 s instead of 6-8 s because it downloads the pinned Go (about 10 s) to build the verifier; installing that Go with setup-go first measured slower (17 s); github-release-safety: Go 0.00-0.01 s, Python 0.03-0.04 s on saved responses, 0.65-0.82 s vs 0.75-0.89 s against GitHub; confidentiality-scan: Go 0.58-0.63 s, Python 0.82-1.07 s on the repository; release-metadata, local 2026-10-24: Go 0.01 s (0.21 s on the first run), Python 0.04-0.07 s on the repository; release-plan, local 2026-10-24, 5 runs each: maven create Go 0.02-0.03 s, Python 0.04-0.05 s; nuget create Go 0.02 s, Python 0.05 s on the repository"
findings = "markdown-links: the same findings as the Python check on the repository and on a seeded copy (missing file, missing anchor, numbered repeat anchor, link that leaves the repository); backend-reports: the same findings on the repository and on a seeded copy (wrong title, missing section, empty section, no priority, capability, or verification); generated-artifacts: the same 14 leftover build outputs reported by both checkers in a used checkout; ci-select: the same areas and unit test modules as the two Python selectors for 2,351 path sets (every tracked file, seeded edge paths, and the changed files of the last 600 commits), apart from the two removed selector test modules; a test file name that is not a plain dotted identifier now runs every unit test instead of reaching the shell; github-release-safety: the same exit code and output as the Python check for 504 seeded copies of the live branch protection, branch summary, and release environment responses (each member deleted, set to null or a string, or flipped; 69 fail), except 2 copies with a null contexts list, where Python stopped with a type error and Go reads the checks list; confidentiality-scan: the same findings in the same order as the Python scan on the repository and on seeded copies with and without Git (156 paths from the rules and edge globs x 2,901 lines: every string in the Python rules as is, indented, uppercased, with trailing space, and with an extra sensitive word; 260,616 findings), apart from rules for the deleted Python scan tests; release-metadata: the same findings as the Python check on the repository and on 9,061 seeded copies (each of the 64 files it reads deleted or given trailing junk, each line deleted that holds a checked string, and each JSON member set to null, a string, or an object, or flipped), after normalizing parser messages and set order, except 402 copies where Python stopped with a type or attribute error (Go reports the finding, or passes when only an unchecked files entry changed), 3 POMs with an undeclared namespace prefix that Python rejects as invalid XML, 2 TOML tables written as plain values that Python read as sets of characters, and 2 Unity samples without a path"
replaces = "scripts/check_markdown_links.py on 2026-10-23 (test coverage: Python 76% of branches, Go 97.7% of statements; a file that is not UTF-8 now fails with its path instead of a traceback); scripts/check_backend_contract_reports.py on 2026-10-23 (Python 72% of branches, Go 96.2% of statements); scripts/check_generated_artifacts.py on 2026-10-23 (Python 65% of branches, Go 100% of statements); scripts/ci_changed_areas.py and scripts/ci_unit_test_targets.py on 2026-10-23 (Python 59% of branches, Go 99.0% of statements; one step instead of two, and the selection job builds the verifier instead of installing Python); scripts/check_github_release_safety.py on 2026-10-23 (Python 73% of branches, Go 100% of statements); scripts/check_confidentiality_scan.py on 2026-10-23 (1,369 lines; its per-file rules became 441 reviewed rows in tools/toolchain-probe/confidentiality-allowlist.tsv, and a test fails when a rule matches no file; Python 97% of branches, Go 98.5% of statements); scripts/check_release_metadata.py and scripts/release_metadata_dotnet.py on 2026-10-24 (2,054 lines; the expected versions moved to tools/toolchain-probe/release-catalog.toml, which the remaining Python release scripts read through scripts/release_catalog.py; TOML is read with pelletier/go-toml/v2; Python 88% of branches, Go 100% of statements); scripts/check_repo_wide_release_versions.py and scripts/read_rust_crate_version.py on 2026-10-24 (the repo-wide package list moved to the release catalog; an XML manifest with an undeclared namespace prefix now fails, as it did in Python; Go 100% of statements); scripts/maven_release_plan.py and scripts/nuget_release_plan.py on 2026-10-24 (537 lines; the Maven artifact list moved to the release catalog; 3,562 runs against the Python scripts on the repository and mutated POMs, projects, selections, and plans gave identical exit codes, output, and files, except usage text, Python tracebacks, the message for a file that is not UTF-8, the bundle-missing message, and two inputs that now fail: a plan with NaN, which is not JSON, and a manifest plan whose selection is not a list; an XML declaration after the start of a document now fails, as in Python; Go 100% of statements)"
checked = 2026-10-24

