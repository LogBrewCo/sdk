runs_in = "CI Contract checks: Run Rust static analysis"
config = "every warning fails, default and all features"
conflicts = "none known"
exceptions = "none"
runtime = "push n=1, max 50 s; pull request n=2, max 51 s"
findings = "unknown: findings are fixed before merge"
replaces = "none"
checked = 2026-10-19

