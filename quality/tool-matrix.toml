runs_in = "CI Contract checks: Check the tool matrix"
config = "this file"
conflicts = "reads commands with a small shell reader; a command built at run time or named by a variable is invisible to it, so tools a gate script runs through a variable are listed under that script"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted command, a changed pin, a changed action commit, a stale or future date, and a missing field each fail"
replaces = "none"
checked = 2026-10-19
