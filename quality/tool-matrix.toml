findings = "markdown-links: the same findings as the Python check on the repository and on a seeded copy (missing file, missing anchor, numbered repeat anchor, link that leaves the repository); generated-artifacts: the same 14 leftover build outputs reported by both checkers in a used checkout; ci-select: the same areas and unit test modules as the two Python selectors for 2,351 path sets (every tracked file, seeded edge paths, and the changed files of the last 600 commits), apart from the two removed selector test modules; a test file name that is not a plain dotted identifier now runs every unit test instead of reaching the shell; github-release-safety: the same exit code and output as the Python check for 504 seeded copies of the live branch protection, branch summary, and release environment responses (each member deleted, set to null or a string, or flipped; 69 fail), except 2 copies with a null contexts list, where Python stopped with a type error and Go reads the checks list; confidentiality-scan: the same findings in the same order as the Python scan on the repository and on seeded copies with and without Git (156 paths from the rules and edge globs x 2,901 lines: every string in the Python rules as is, indented, uppercased, with trailing space, and with an extra sensitive word; 260,616 findings), apart from rules for the deleted Python scan tests; release-metadata: the same findings as the Python check on the repository and on 9,061 seeded copies (each of the 64 files it reads deleted or given trailing junk, each line deleted that holds a checked string, and each JSON member set to null, a string, or an object, or flipped), after normalizing parser messages and set order, except 402 copies where Python stopped with a type or attribute error (Go reports the finding, or passes when only an unchecked files entry changed), 3 POMs with an undeclared namespace prefix that Python rejects as invalid XML, 2 TOML tables written as plain values that Python read as sets of characters, and 2 Unity samples without a path; release-artifacts native-manifest: the same manifests and exit codes as the Python script on the smoke fixtures and on 10,800 generated artifact sets; registry-publication: the same exit codes and output as the Python script on 6,000 generated runs; release-artifacts js-prepare, js-manifest, and js-symbolicate: the same exit codes, output, and written files as the Python scripts on 21,000 runs over 3,000 generated build directories (minified files with mutated sourceMappingURL and debugId comments, line endings, and invalid UTF-8; source maps mutated, truncated, or not JSON; symbolic links; mutated prefixes, options, manifests, and stack frames), after normalizing parser messages; js-fake-intake: the same status codes and recorded events; release-artifacts native-upload: the same exit codes, output, and intake requests as the Python script on 6,000 generated runs (artifact roots with ProGuard mappings, ELF symbol directories, and Unity archives; manifests with mutated fields, paths, symbolic links, and changed files; loopback and other endpoints, options, tokens, and intake status sequences), after normalizing parser messages; receipt: the same exit codes, output, metadata, and extracted files as the Python script on 6,000 generated cases (about 24,000 runs of ids, bind, attest, and extract over mutated supplied paths, metadata, and ZIP and tar archives that are compressed, truncated, or corrupted), except 6 corrupt compressed streams that now fail and 8 failed extractions where Python left partial files; release-checks: the same exit codes, output, and files as the Python scripts on 7,000 generated runs (npm peer ranges and manifests, workspace and publication plans against a fake bun and registry responses, Maven POMs and JARs, NuGet receipts and package folders, release notes over varied commit subjects, paths, and tags, including a message in another encoding, GitHub publication runs, and Maven Central deployment capture and polling with status sequences and timeouts), apart from the differences listed under replaces"
