r mark, or in UTF-16 or UTF-32 from GitHub, Maven Central, or the npm registry, npm registry JSON that is not UTF-8 or is over 16 MiB, POMs declared in another encoding or with DOCTYPE entities, and ZIP64 JARs; the Node package peer range for @logbrew/sdk is now checked by release-metadata; protected release jobs build the verifier from the protected checkout without a cache; Go 100% of statements); scripts/release_catalog.py on 2026-10-25 (47 lines; publishing, reconciliation, and the HttpClient compatibility smoke get the NuGet core dependency range from release-checks nuget-range, and the release-prep test reads the catalog directly; 2,021 versions gave the same range or failure as the Python function, except versions with spaces, underscores, non-ASCII digits, or numbers beyond 64 bits, which now fail; Go 100% of statements)"
