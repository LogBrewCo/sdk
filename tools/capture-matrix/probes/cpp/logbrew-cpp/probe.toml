family = "cpp"
method = "C++ program built with CMake find_package(LogBrew) against the installed SDK and LogBrew::HttpTransport, with client resource context, a TelemetryScope for session and user, a breadcrumb, and two requests under TraceScope from an incoming W3C traceparent; each logs and records a span and a metric, and a thrown and caught exception captures an issue with a frame from issue_frame_from_location; the core has no framework hooks or crash handler, so its documented API is the capture path"
run = ["bash", "-c", "cmake -S . -B build -DCMAKE_PREFIX_PATH=\"$LOGBREW_CAPTURE_WORK/prefix\" >/dev/null && cmake --build build >/dev/null && build/probe"]
