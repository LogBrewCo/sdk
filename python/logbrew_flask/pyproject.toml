[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "logbrew-flask"
version = "0.1.4"
description = "Flask integration for capturing LogBrew request spans and exceptions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "LogBrew" }
]
keywords = ["logbrew", "observability", "flask", "wsgi", "logs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = [
  "Flask>=3.1",
  "logbrew-sdk>=0.1.9,<0.2.0"
]

[project.urls]
Homepage = "https://logbrew.co"
Documentation = "https://github.com/LogBrewCo/sdk/tree/main/python/logbrew_flask"
Repository = "https://github.com/LogBrewCo/sdk"
Issues = "https://github.com/LogBrewCo/sdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logbrew_flask = ["py.typed"]
