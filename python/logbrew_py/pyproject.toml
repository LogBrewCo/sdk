[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "logbrew-sdk"
version = "0.1.12"
description = "Public LogBrew Python SDK for building, validating, and flushing event batches."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "LogBrew" }
]
dependencies = [
  "certifi>=2026.7.22",
  "truststore>=0.10.4,<1",
  "typing-extensions>=4.1; python_version < '3.11'",
]
keywords = ["logbrew", "observability", "logs", "traces", "events"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.urls]
Repository = "https://github.com/LogBrewCo/sdk"

[project.optional-dependencies]
celery = ["celery>=5,<6"]
persistence = ["cryptography>=49,<50"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logbrew_sdk = ["py.typed"]
