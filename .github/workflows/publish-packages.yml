name: Publish Packages
run-name: Publish ${{ inputs.target }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag or commit SHA to publish"
        required: true
        default: "v0.1.0"
      target:
        description: "Registry target"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - npm
          - pypi
          - crates
          - rubygems
          - nuget
          - packagist
          - maven
          - verify
      dry_run:
        description: "Validate and package without publishing"
        required: true
        type: boolean
        default: true
      include_unity_npm:
        description: "Include the Unity UPM-compatible npm package"
        required: true
        type: boolean
        default: false
      npm_packages:
        description: "Comma-separated npm package names or dirs to publish; empty publishes all npm packages"
        required: false
        type: string
        default: ""
      nuget_packages:
        description: "Approved comma-separated NuGet release set; empty publishes all NuGet packages"
        required: false
        type: string
        default: ""
      include_pypi_extras:
        description: "Publish FastAPI, Flask, and Django PyPI packages after their publishers are configured"
        required: true
        type: boolean
        default: false
      include_crates_publish:
        description: "Publish the Rust crate after crates.io ownership/trusted publishing is configured"
        required: true
        type: boolean
        default: false
      include_packagist_update:
        description: "Trigger Packagist update hook after package ownership is ready"
        required: true
        type: boolean
        default: false
      include_maven_publish:
        description: "Publish Maven Central bundle after release settings are ready"
        required: true
        type: boolean
        default: false
      maven_artifacts:
        description: "Comma-separated Maven artifact ids to package and publish"
        required: false
        type: string
        default: ""
      include_go_module:
        description: "Verify the Go module can be installed from public tags"
        required: true
        type: boolean
        default: false
      include_swiftpm:
        description: "Verify Swift products from the exact public SwiftPM tag"
        required: true
        type: boolean
        default: false
      verify_version:
        description: "Default public package version expected by target=verify; empty uses verifier default"
        required: false
        type: string
        default: ""
      verify_npm_versions:
        description: "Comma-separated npm PACKAGE=VERSION overrides for target=verify"
        required: false
        type: string
        default: ""
      verify_pypi_versions:
        description: "Comma-separated PyPI PACKAGE=VERSION overrides for target=verify"
        required: false
        type: string
        default: ""
      verify_nuget_versions:
        description: "Comma-separated NuGet PACKAGE=VERSION overrides for target=verify"
        required: false
        type: string
        default: ""
      verify_maven_artifacts:
        description: "Comma-separated Maven artifact ids for target=verify"
        required: false
        type: string
        default: ""
      verify_maven_versions:
        description: "Comma-separated Maven PACKAGE=VERSION overrides for target=verify"
        required: false
        type: string
        default: ""
      verify_swiftpm_version:
        description: "Exact public SwiftPM version for target=verify when include_swiftpm is enabled"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ inputs.ref }}-${{ inputs.target }}-${{ inputs.npm_packages }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm packages
    if: ${{ inputs.target == 'all' || inputs.target == 'npm' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      INCLUDE_UNITY_NPM: ${{ inputs.include_unity_npm }}
      NPM_PACKAGES: ${{ inputs.npm_packages }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install npm publisher
        run: |
          bun install --cwd tools/npm-publish --frozen-lockfile --ignore-scripts
          (cd tools/npm-publish && bun audit)

      - name: Publish npm packages
        id: npm-packages
        shell: bash
        run: |
          set -Eeuo pipefail

          workspace_package_dirs=(
            js/logbrew-js
            js/logbrew-browser
            js/logbrew-node
            js/logbrew-prisma
            js/logbrew-bullmq
            js/logbrew-kafkajs
            js/logbrew-amqplib
            js/logbrew-aws-sqs
            js/logbrew-express
            js/logbrew-fastify
            js/logbrew-nestjs
            js/logbrew-angular
            js/logbrew-vue
            js/logbrew-svelte
            js/logbrew-react
            js/logbrew-react-native
            js/logbrew-next
          )
          package_field() {
            bun -e 'const manifest = require(process.argv[1]); console.log(manifest[process.argv[2]])' "./$1/package.json" "$2"
          }

          select_npm_package_dirs() {
            local selectors="$1"
            shift

            if [[ -z "$selectors" ]]; then
              printf '%s\n' "$@"
              return
            fi

            local selected_package_dirs=() requested_packages=()
            IFS=',' read -ra requested_packages <<< "$selectors"
            for requested_package in "${requested_packages[@]}"; do
              requested_package="$(printf '%s' "$requested_package" | xargs)"
              [[ -z "$requested_package" ]] && continue
              for package_dir in "$@"; do
                package_name="$(package_field "$package_dir" name)"
                [[ "$requested_package" == "$package_dir" || "$requested_package" == "$package_name" ]] || continue
                [[ " ${selected_package_dirs[*]} " == *" ${package_dir} "* ]] || selected_package_dirs+=("$package_dir")
                continue 2
              done
              echo "Unknown npm package selector: $requested_package" >&2
              exit 1
            done

            if [[ "${#selected_package_dirs[@]}" -eq 0 ]]; then
              echo "npm_packages did not include any package selectors" >&2
              exit 1
            fi
            printf '%s\n' "${selected_package_dirs[@]}"
          }

          mapfile -t package_dirs < <(select_npm_package_dirs "$NPM_PACKAGES" "${workspace_package_dirs[@]}")

          if [[ "$INCLUDE_UNITY_NPM" == "true" ]]; then
            package_dirs+=(unity/logbrew-unity)
            workspace_package_dirs+=(unity/logbrew-unity)
          fi

          peer_release_args=(--registry "https://registry.npmjs.org")
          for package_dir in "${workspace_package_dirs[@]}"; do
            peer_release_args+=(--workspace-dir "$package_dir")
          done
          for package_dir in "${package_dirs[@]}"; do
            peer_release_args+=(--selected-dir "$package_dir")
          done
          python3 scripts/check_npm_workspace_peer_release.py "${peer_release_args[@]}"

          if [[ " ${package_dirs[*]} " == *" js/logbrew-react-native "* ]]; then
            bash scripts/real_user_react_native_minimum_peer_smoke.sh
          fi

          metadata_args=()
          selected_package_versions=()
          for package_dir in "${package_dirs[@]}"; do
            package_name="$(package_field "$package_dir" name)"
            package_version="$(package_field "$package_dir" version)"
            selected_package_versions+=("$package_name=$package_version")
            if [[ -n "$NPM_PACKAGES" && "$package_dir" == js/logbrew-* ]]; then
              metadata_args+=(--npm-version "$package_name=$package_version")
            fi
          done

          python3 scripts/check_release_metadata.py "${metadata_args[@]}"

          npm_publication_plan="$(mktemp)"
          publication_plan_args=(--registry "https://registry.npmjs.org")
          for package_version in "${selected_package_versions[@]}"; do
            [[ "$package_version" == co.logbrew.unity=* ]] && continue
            publication_plan_args+=(--package "$package_version")
          done
          missing_npm_packages=()
          python3 scripts/plan_npm_publication.py \
            "${publication_plan_args[@]}" > "$npm_publication_plan"
          bun -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const stringArray = (value) =>
              Array.isArray(value) && value.every((entry) => typeof entry === "string");
            if (!stringArray(plan.existingVersions) || !stringArray(plan.missingPackagePages)) {
              console.error("npm publication preflight returned an invalid receipt");
              process.exit(1);
            }
            if (plan.existingVersions.length > 0) {
              const versions = plan.existingVersions.join("\n- ");
              console.error("Selected npm versions already exist and are immutable:\n- " + versions +
                "\nAdvance every colliding package version before retrying the selected release.");
              process.exit(1);
            }
            const missing = plan.missingPackagePages;
            fs.writeFileSync(process.argv[1], missing.length > 0 ? missing.join("\n") + "\n" : "");
          ' "$npm_publication_plan"
          mapfile -t missing_npm_packages < "$npm_publication_plan"
          rm -f "$npm_publication_plan"

          if [[ "$DRY_RUN" != "true" && -z "$NPM_PACKAGES" ]]; then
            echo "Bun publication requires an explicit npm_packages selection." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "${#missing_npm_packages[@]}" -gt 0 ]]; then
            printf 'npm trusted publishing requires existing package pages:\n' >&2
            printf -- '- %s\n' "${missing_npm_packages[@]}" >&2
            exit 1
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            for package_dir in "${package_dirs[@]}"; do
              (cd "$package_dir" && bun pm pack --dry-run --ignore-scripts)
            done
          else
            bun run tools/npm-publish/publish.mjs "${package_dirs[@]}"
          fi

          printf 'selected_package_versions<<EOF\n%s\nEOF\n' \
            "$(printf '%s\n' "${selected_package_versions[@]}")" >> "$GITHUB_OUTPUT"

      - name: Verify public npm packages
        if: ${{ ! inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          dispatch_epoch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '.created_at | fromdateiso8601')"
          verify_args=(--target npm)
          install_specs=()

          while IFS= read -r package_version; do
            [[ -n "$package_version" && "$package_version" != co.logbrew.unity=* ]] || continue
            verify_args+=(--npm-package "${package_version%%=*}" --npm-version "$package_version")
            install_specs+=("${package_version/=/@}")
          done <<< "${{ steps.npm-packages.outputs.selected_package_versions }}"

          if [[ "$INCLUDE_UNITY_NPM" == "true" ]]; then
            verify_args+=(--include-unity-npm)
          fi
          python3 scripts/check_registry_publication.py "${verify_args[@]}" \
            --require-npm-provenance --timeout 2 --retries 8 --retry-delay 1

          install_dir="$(mktemp -d)"
          trap 'find "$install_dir" -depth -delete' EXIT
          for attempt in {1..8}; do
            (cd "$install_dir" && bun add --force --no-cache --exact --ignore-scripts "${install_specs[@]}") && break
            (( attempt < 8 )) || exit 1
            sleep 1
          done
          if grep -Eq '(file:|link:|/private/tmp|/home/runner/work)' \
            "$install_dir/package.json" "$install_dir/bun.lock"; then
            echo "Clean install contains a local source reference" >&2
            exit 1
          fi

          elapsed=$(( $(date +%s) - dispatch_epoch ))
          echo "npm release receipt: registry, SLSA provenance, and clean Bun install in ${elapsed}s"
          if (( elapsed >= 60 )); then
            echo "npm release exceeded the under-60-second dispatch-to-install target" >&2
            exit 1
          fi

  pypi:
    name: PyPI packages
    if: ${{ inputs.target == 'all' || inputs.target == 'pypi' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read Python package versions
        id: pypi-version
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/python_package_version.sh
          core_version="$(python_package_version python/logbrew_py/pyproject.toml)"
          fastapi_version="$(python_package_version python/logbrew_fastapi/pyproject.toml)"
          flask_version="$(python_package_version python/logbrew_flask/pyproject.toml)"
          django_version="$(python_package_version python/logbrew_django/pyproject.toml)"
          {
            echo "version=$core_version"
            echo "core_version=$core_version"
            echo "fastapi_version=$fastapi_version"
            echo "flask_version=$flask_version"
            echo "django_version=$django_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build Python distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --requirement scripts/python_release_tools.txt
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ ! "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release source timestamp is invalid." >&2
            exit 1
          fi
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          export PYTHONHASHSEED=0
          export TZ=UTC
          {
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "PYTHONHASHSEED=$PYTHONHASHSEED"
            echo "TZ=$TZ"
          } >> "$GITHUB_ENV"
          for package_dir in python/logbrew_py python/logbrew_fastapi python/logbrew_flask python/logbrew_django; do
            output_dir="dist/pypi/$(basename "$package_dir")"
            python -m build \
              --no-isolation \
              --sdist \
              --wheel \
              --outdir "$output_dir" \
              "$package_dir"
            python3 scripts/check_python_release_artifacts.py normalize-sdist \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              "$output_dir"/*.tar.gz
            python -m twine check "$output_dir"/*
          done

      - name: Create Python release manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_python_release_artifacts.py create \
            --directory dist/pypi \
            --source-commit "$(git rev-parse HEAD)" \
            --python-version "logbrew-sdk=${{ steps.pypi-version.outputs.core_version }}" \
            --python-version "logbrew-fastapi=${{ steps.pypi-version.outputs.fastapi_version }}" \
            --python-version "logbrew-flask=${{ steps.pypi-version.outputs.flask_version }}" \
            --python-version "logbrew-django=${{ steps.pypi-version.outputs.django_version }}" \
            --manifest dist/pypi/python-release-artifacts.json

      - name: Verify reproducible Python distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          for package_dir in python/logbrew_py python/logbrew_fastapi python/logbrew_flask python/logbrew_django; do
            output_dir="$RUNNER_TEMP/python-reproducibility/$(basename "$package_dir")"
            python -m build \
              --no-isolation \
              --sdist \
              --wheel \
              --outdir "$output_dir" \
              "$package_dir"
            python3 scripts/check_python_release_artifacts.py normalize-sdist \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              "$output_dir"/*.tar.gz
          done
          python3 scripts/check_python_release_artifacts.py verify \
            --directory "$RUNNER_TEMP/python-reproducibility" \
            --manifest dist/pypi/python-release-artifacts.json

      - name: Verify packed Python distributions
        run: |
          bash scripts/real_user_python_public_pypi_smoke.sh --manifest \
            dist/pypi/python-release-artifacts.json \
            --artifact-root dist/pypi

      - name: Upload Python release manifest
        uses: actions/upload-artifact@v6
        with:
          name: python-release-manifest
          path: dist/pypi/python-release-artifacts.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish logbrew-sdk to PyPI
        if: ${{ ! inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/logbrew_py
          skip-existing: true

      - name: Publish logbrew-fastapi to PyPI
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/logbrew_fastapi
          skip-existing: true

      - name: Publish logbrew-flask to PyPI
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/logbrew_flask
          skip-existing: true

      - name: Publish logbrew-django to PyPI
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/logbrew_django
          skip-existing: true

      - name: Explain skipped PyPI extras
        if: ${{ ! inputs.dry_run && ! inputs.include_pypi_extras }}
        run: |
          echo "Published core logbrew-sdk only."
          echo "Set include_pypi_extras=true after logbrew-fastapi, logbrew-flask, and logbrew-django PyPI publishers are configured."

      - name: Verify public PyPI packages
        if: ${{ ! inputs.dry_run }}
        shell: bash
        run: |
          set -Eeuo pipefail
          verify_args=(--target pypi)
          if [[ "${{ inputs.include_pypi_extras }}" == "true" ]]; then
            verify_args+=(--include-pypi-extras)
            verify_args+=(--pypi-version "logbrew-fastapi=${{ steps.pypi-version.outputs.fastapi_version }}")
            verify_args+=(--pypi-version "logbrew-flask=${{ steps.pypi-version.outputs.flask_version }}")
            verify_args+=(--pypi-version "logbrew-django=${{ steps.pypi-version.outputs.django_version }}")
          fi
          verify_args+=(--version "${{ steps.pypi-version.outputs.version }}")
          python3 scripts/check_registry_publication.py "${verify_args[@]}"

      - name: Resolve public PyPI artifacts
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_python_release_artifacts.py resolve-public \
            --directory dist/pypi \
            --manifest dist/pypi/python-release-artifacts.json \
            --output-directory "$RUNNER_TEMP/python-public-artifacts" \
            --public-manifest "$RUNNER_TEMP/python-public-release-artifacts.json" \
            --reconciliation "$RUNNER_TEMP/python-public-reconciliation.json"

      - name: Upload Python public reconciliation
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        uses: actions/upload-artifact@v6
        with:
          name: python-public-reconciliation
          path: |
            ${{ runner.temp }}/python-public-release-artifacts.json
            ${{ runner.temp }}/python-public-reconciliation.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify public PyPI installs
        if: ${{ ! inputs.dry_run && inputs.include_pypi_extras }}
        run: |
          bash scripts/real_user_python_public_pypi_smoke.sh --manifest \
            "$RUNNER_TEMP/python-public-release-artifacts.json" \
            --artifact-root "$RUNNER_TEMP/python-public-artifacts"

  crates:
    name: crates.io package
    if: ${{ inputs.target == 'all' || inputs.target == 'crates' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read Rust crate version
        id: crate-version
        run: echo "version=$(python3 scripts/read_rust_crate_version.py rust/logbrew/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Dry-run crate package
        working-directory: rust/logbrew
        run: cargo publish --dry-run

      - name: Authenticate to crates.io
        if: ${{ ! inputs.dry_run && inputs.include_crates_publish }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ ! inputs.dry_run && inputs.include_crates_publish }}
        working-directory: rust/logbrew
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish

      - name: Set up Python for registry verification
        if: ${{ ! inputs.dry_run && inputs.include_crates_publish }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify public crates.io package
        if: ${{ ! inputs.dry_run && inputs.include_crates_publish }}
        run: python3 scripts/check_registry_publication.py --target crates --version "${{ steps.crate-version.outputs.version }}"

      - name: Explain skipped crate publish
        if: ${{ ! inputs.dry_run && ! inputs.include_crates_publish && inputs.target == 'all' }}
        run: |
          echo "Validated the Rust crate dry-run only."
          echo "Set include_crates_publish=true after the logbrew crate ownership/trusted publishing path is configured."

      - name: Refuse implicit crate-only publish
        if: ${{ ! inputs.dry_run && ! inputs.include_crates_publish && inputs.target == 'crates' }}
        run: |
          echo "Refusing a real crates.io publish without include_crates_publish=true."
          echo "Configure the logbrew crate ownership/trusted publishing path first, then rerun target=crates with include_crates_publish=true."
          exit 1

  rubygems:
    name: RubyGems package
    if: ${{ inputs.target == 'all' || inputs.target == 'rubygems' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build gem
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/rubygems
          (
            cd ruby/logbrew-ruby
            gem_file="$(
              ruby -e 'spec = Gem::Specification.load("logbrew-sdk.gemspec") or abort "failed to load logbrew-sdk.gemspec"; print "#{spec.name}-#{spec.version}.gem"'
            )"
            gem build logbrew-sdk.gemspec --strict --output "$GITHUB_WORKSPACE/dist/rubygems/$gem_file"
          )

      - name: Configure RubyGems trusted publishing credentials
        if: ${{ ! inputs.dry_run }}
        uses: rubygems/configure-rubygems-credentials@v2.0.0

      - name: Publish gem
        if: ${{ ! inputs.dry_run }}
        run: gem push dist/rubygems/*.gem

      - name: Set up Python for registry verification
        if: ${{ ! inputs.dry_run }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify public RubyGems package
        if: ${{ ! inputs.dry_run }}
        run: python3 scripts/check_registry_publication.py --target rubygems

  nuget:
    name: NuGet package
    if: ${{ inputs.target == 'all' || inputs.target == 'nuget' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-nuget.yml
    with:
      ref: ${{ inputs.ref }}
      dry_run: ${{ inputs.dry_run }}
      nuget_packages: ${{ inputs.nuget_packages }}
    secrets: inherit
  packagist:
    name: Packagist package
    if: ${{ inputs.target == 'packagist' || (inputs.target == 'all' && (inputs.dry_run || inputs.include_packagist_update)) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    env:
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Validate Composer packages
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict composer.json
          composer validate --strict php/logbrew-php/composer.json

      - name: Trigger Packagist update
        if: ${{ ! inputs.dry_run }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PACKAGIST_USERNAME:-}" || -z "${PACKAGIST_API_TOKEN:-}" ]]; then
            echo "Packagist update settings are not present; relying on Packagist auto-update for the GitHub repository."
            exit 0
          fi
          curl -fsS \
            -X POST \
            -H "content-type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/LogBrewCo/sdk"}}'

      - name: Set up Python for registry verification
        if: ${{ ! inputs.dry_run }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify public Packagist package
        if: ${{ ! inputs.dry_run }}
        run: python3 scripts/check_registry_publication.py --target packagist --retries 20 --retry-delay 30

  maven:
    name: Maven Central package
    if: ${{ inputs.target == 'maven' || (inputs.target == 'all' && (inputs.dry_run || inputs.include_maven_publish)) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Bind immutable Maven release source
        if: ${{ ! inputs.dry_run }}
        id: maven-release-source
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release source checkout." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out protected Maven release control
        if: ${{ ! inputs.dry_run }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .release-control
          persist-credentials: false
          sparse-checkout: scripts/check_maven_central_deployment.py
          sparse-checkout-cone-mode: false

      - name: Bind protected Maven release control
        if: ${{ ! inputs.dry_run }}
        id: maven-release-control
        shell: bash
        env:
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_SOURCE_SHA: ${{ steps.maven-release-source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          control_root="$GITHUB_WORKSPACE/.release-control"
          if [[ ! "$RELEASE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ || ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release checkout binding." >&2
            exit 1
          fi
          if [[ ! -d "$control_root" || -L "$control_root" ]]; then
            echo "Protected release control is unavailable." >&2
            exit 1
          fi
          actual_source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          actual_control_sha="$(git -C "$control_root" rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual_source_sha" != "$RELEASE_SOURCE_SHA" || "$actual_control_sha" != "$RELEASE_CONTROL_SHA" ]]; then
            echo "Release checkout binding mismatch." >&2
            exit 1
          fi
          control_script="$control_root/scripts/check_maven_central_deployment.py"
          if [[ ! -f "$control_script" || -L "$control_script" ]]; then
            echo "Protected release control is incomplete." >&2
            exit 1
          fi
          expected_control_sha256="$(
            git -C "$control_root" show "${RELEASE_CONTROL_SHA}:scripts/check_maven_central_deployment.py" |
              sha256sum | awk '{print $1}'
          )"
          actual_control_sha256="$(sha256sum "$control_script" | awk '{print $1}')"
          if [[ ! "$expected_control_sha256" =~ ^[0-9a-f]{64}$ || "$actual_control_sha256" != "$expected_control_sha256" ]]; then
            echo "Protected release control changed." >&2
            exit 1
          fi
          printf 'script_sha256=%s\n' "$expected_control_sha256" >> "$GITHUB_OUTPUT"

      - name: Plan selected Maven artifacts
        env:
          MAVEN_ARTIFACTS_INPUT: ${{ inputs.maven_artifacts }}
        run: |
          set -Eeuo pipefail
          python3 scripts/maven_release_plan.py create --root "$GITHUB_WORKSPACE" \
            --artifacts-env MAVEN_ARTIFACTS_INPUT \
            --output "$RUNNER_TEMP/logbrew-maven-release-plan.json"

      - name: Check selected Maven version collisions
        run: |
          set -Eeuo pipefail
          plan="$RUNNER_TEMP/logbrew-maven-release-plan.json"
          python3 scripts/check_registry_publication.py --target maven --maven-plan "$plan" \
            --maven-plan-scope selected --expect-absent --retries 0
          python3 scripts/check_registry_publication.py --target maven --maven-plan "$plan" \
            --maven-plan-scope dependencies --retries 6 --retry-delay 10

      - name: Check Maven Central auth preflight
        if: ${{ ! inputs.dry_run }}
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: bash scripts/check_maven_central_auth_preflight.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Maven Central deployment bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_ID: ${{ secrets.MAVEN_GPG_KEY_ID }}
        run: |
          set -Eeuo pipefail
          bundle_args=(--plan "$RUNNER_TEMP/logbrew-maven-release-plan.json")
          bundle_args+=(--output "$RUNNER_TEMP/logbrew-maven-central-bundle.zip")
          bundle_args+=(--manifest "$RUNNER_TEMP/logbrew-maven-central-manifest.json")
          if [[ "${{ inputs.dry_run }}" != "true" ]]; then
            bundle_args+=(--sign)
          fi
          bash scripts/build_maven_central_bundle.sh "${bundle_args[@]}"
          python3 - "$RUNNER_TEMP/logbrew-maven-central-bundle.zip" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
          print(f"maven central bundle entries ok ({len(names)} files)")
          PY

      - name: Verify selected Maven bundle install
        run: bash scripts/real_user_maven_central_public_smoke.sh --plan "$RUNNER_TEMP/logbrew-maven-release-plan.json" --bundle "$RUNNER_TEMP/logbrew-maven-central-bundle.zip"

      - name: Upload Maven release manifest
        uses: actions/upload-artifact@v6
        with:
          name: logbrew-maven-release-manifest
          path: ${{ runner.temp }}/logbrew-maven-central-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Maven Central deployment bundle
        if: ${{ ! inputs.dry_run }}
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_RELEASE_CONTROL_SHA256: ${{ steps.maven-release-control.outputs.script_sha256 }}
        run: |
          set -Eeuo pipefail
          : "${CENTRAL_PORTAL_USERNAME:?Set CENTRAL_PORTAL_USERNAME as a release environment secret.}"
          : "${CENTRAL_PORTAL_PASSWORD:?Set CENTRAL_PORTAL_PASSWORD as a release environment secret.}"
          control_script="$GITHUB_WORKSPACE/.release-control/scripts/check_maven_central_deployment.py"
          verify_control_script() {
            actual_control_sha256="$(sha256sum "$control_script" | awk '{print $1}')"
            if [[ ! "$MAVEN_RELEASE_CONTROL_SHA256" =~ ^[0-9a-f]{64}$ || "$actual_control_sha256" != "$MAVEN_RELEASE_CONTROL_SHA256" ]]; then
              echo "Protected release control changed." >&2
              exit 1
            fi
          }
          verify_control_script
          central_bearer="$(
            python3 - <<'PY'
          import base64
          import os

          raw = f"{os.environ['CENTRAL_PORTAL_USERNAME']}:{os.environ['CENTRAL_PORTAL_PASSWORD']}".encode()
          print(base64.b64encode(raw).decode())
          PY
          )"
          response_file="$RUNNER_TEMP/logbrew-maven-central-upload-response"
          if [[ -e "$response_file" || -L "$response_file" ]]; then
            echo "Maven Central upload response is unavailable." >&2
            exit 1
          fi
          trap 'rm -f "$response_file"' EXIT
          umask 077
          set +e
          curl --fail-with-body --silent \
            --request POST \
            --header "Authorization: Bearer ${central_bearer}" \
            --form "bundle=@${RUNNER_TEMP}/logbrew-maven-central-bundle.zip" \
            --max-filesize 128 \
            --output "$response_file" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            2>/dev/null
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 ]]; then
            echo "Maven Central upload failed." >&2
            echo "For HTTP 401, verify the Central Portal release env pair uses generated Central Portal publishing values with co.logbrew namespace publish access, not Central account login values." >&2
            exit "$curl_status"
          fi
          verify_control_script
          python3 "$control_script" \
            capture --deployment-id-file "$RUNNER_TEMP/logbrew-maven-central-deployment-id" \
            < "$response_file"

      - name: Wait for Maven Central deployment
        if: ${{ ! inputs.dry_run }}
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_RELEASE_CONTROL_SHA256: ${{ steps.maven-release-control.outputs.script_sha256 }}
        run: |
          set -Eeuo pipefail
          control_script="$GITHUB_WORKSPACE/.release-control/scripts/check_maven_central_deployment.py"
          actual_control_sha256="$(sha256sum "$control_script" | awk '{print $1}')"
          if [[ ! "$MAVEN_RELEASE_CONTROL_SHA256" =~ ^[0-9a-f]{64}$ || "$actual_control_sha256" != "$MAVEN_RELEASE_CONTROL_SHA256" ]]; then
            echo "Protected release control changed." >&2
            exit 1
          fi
          python3 "$control_script" \
            wait --deployment-id-file "$RUNNER_TEMP/logbrew-maven-central-deployment-id" \
            --timeout-seconds 3600 --poll-interval-seconds 30

      - name: Verify Maven Central publication
        if: ${{ ! inputs.dry_run }}
        run: |
          python3 scripts/check_registry_publication.py --target maven \
            --maven-plan "$RUNNER_TEMP/logbrew-maven-release-plan.json" \
            --maven-plan-scope selected --retries 20 --retry-delay 30

      - name: Verify public Maven Central install
        if: ${{ ! inputs.dry_run }}
        run: bash scripts/real_user_maven_central_public_smoke.sh --plan "$RUNNER_TEMP/logbrew-maven-release-plan.json"

  verify:
    name: Public registry verification
    if: >-
      ${{
        inputs.target == 'verify' &&
        (
          ! inputs.include_swiftpm ||
          inputs.include_unity_npm ||
          inputs.include_pypi_extras ||
          inputs.include_crates_publish ||
          inputs.include_packagist_update ||
          inputs.include_maven_publish ||
          inputs.include_go_module ||
          inputs.verify_version != '' ||
          inputs.verify_npm_versions != '' ||
          inputs.verify_pypi_versions != '' ||
          inputs.verify_nuget_versions != '' ||
          inputs.verify_maven_artifacts != '' ||
          inputs.verify_maven_versions != ''
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Go for module verification
        if: ${{ inputs.include_go_module }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Bind immutable verify source
        id: verify-source
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ || "$source_sha" != "$RELEASE_REF" ]]; then
            echo "Invalid verify source checkout." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out protected verify control
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .release-control
          persist-credentials: false
          sparse-checkout: |
            scripts/check_registry_publication.py
            scripts/check_release_metadata.py
            scripts/release_metadata_dotnet.py
            scripts/real_user_swiftpm_public_smoke.sh
            scripts/release_artifact_receipt.py
            scripts/validate_fixtures.py
            scripts/check_sdk_parity.py
            fixtures/valid-batch.json
          sparse-checkout-cone-mode: false

      - name: Bind protected verify control
        shell: bash
        env:
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_SOURCE_SHA: ${{ steps.verify-source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          control_root="$GITHUB_WORKSPACE/.release-control"
          if [[ ! "$RELEASE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ || ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid verify checkout binding." >&2
            exit 1
          fi
          actual_source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          actual_control_sha="$(git -C "$control_root" rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual_source_sha" != "$RELEASE_SOURCE_SHA" || "$actual_control_sha" != "$RELEASE_CONTROL_SHA" ]]; then
            echo "Verify checkout binding mismatch." >&2
            exit 1
          fi
          control_files=(
            scripts/check_registry_publication.py
            scripts/check_release_metadata.py
            scripts/release_metadata_dotnet.py
            scripts/real_user_swiftpm_public_smoke.sh
            scripts/release_artifact_receipt.py
            scripts/validate_fixtures.py
            scripts/check_sdk_parity.py
            fixtures/valid-batch.json
          )
          for relative_path in "${control_files[@]}"; do
            control_path="$control_root/$relative_path"
            if [[ ! -f "$control_path" || -L "$control_path" ]]; then
              echo "Protected verify control is incomplete." >&2
              exit 1
            fi
          done
          if ! git -C "$control_root" diff --quiet HEAD -- "${control_files[@]}"; then
            echo "Protected verify control changed." >&2
            exit 1
          fi

      - name: Verify public registry packages
        shell: bash
        env:
          VERIFY_VERSION: ${{ inputs.verify_version }}
          VERIFY_NPM_VERSIONS: ${{ inputs.verify_npm_versions }}
          VERIFY_PYPI_VERSIONS: ${{ inputs.verify_pypi_versions }}
          VERIFY_NUGET_VERSIONS: ${{ inputs.verify_nuget_versions }}
          VERIFY_MAVEN_ARTIFACTS: ${{ inputs.verify_maven_artifacts }}
          VERIFY_MAVEN_VERSIONS: ${{ inputs.verify_maven_versions }}
        run: |
          set -Eeuo pipefail
          verify_args=(--target all --require-released-package-set)
          append_values() {
            local flag="$1"
            local raw_values="$2"
            local value_entry
            if [[ -z "$raw_values" ]]; then
              return
            fi
            IFS=',' read -ra value_entries <<< "$raw_values"
            for value_entry in "${value_entries[@]}"; do
              value_entry="$(printf '%s' "$value_entry" | xargs)"
              if [[ -n "$value_entry" ]]; then
                verify_args+=("$flag" "$value_entry")
              fi
            done
          }
          if [[ -n "$VERIFY_VERSION" ]]; then
            verify_args+=(--version "$VERIFY_VERSION")
          fi
          append_values --npm-version "$VERIFY_NPM_VERSIONS"
          append_values --pypi-version "$VERIFY_PYPI_VERSIONS"
          append_values --nuget-version "$VERIFY_NUGET_VERSIONS"
          append_values --maven-artifact "$VERIFY_MAVEN_ARTIFACTS"
          append_values --maven-version "$VERIFY_MAVEN_VERSIONS"
          if [[ "${{ inputs.include_unity_npm }}" == "true" ]]; then
            verify_args+=(--include-unity-npm)
          fi
          if [[ "${{ inputs.include_pypi_extras }}" == "true" ]]; then
            verify_args+=(--include-pypi-extras)
          fi
          if [[ "${{ inputs.include_crates_publish }}" == "true" ]]; then
            verify_args+=(--include-crates)
          fi
          if [[ "${{ inputs.include_packagist_update }}" == "true" ]]; then
            verify_args+=(--include-packagist)
          fi
          if [[ "${{ inputs.include_maven_publish }}" == "true" || -n "$VERIFY_MAVEN_ARTIFACTS" || -n "$VERIFY_MAVEN_VERSIONS" ]]; then
            verify_args+=(--include-maven)
          fi
          if [[ "${{ inputs.include_go_module }}" == "true" ]]; then
            verify_args+=(--include-go)
          fi
          python3 "$GITHUB_WORKSPACE/.release-control/scripts/check_registry_publication.py" \
            "${verify_args[@]}"

  verify-swiftpm:
    name: Public SwiftPM verification
    if: ${{ inputs.target == 'verify' && inputs.include_swiftpm }}
    runs-on: macos-15
    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Bind immutable verify source
        id: verify-source
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ || "$source_sha" != "$RELEASE_REF" ]]; then
            echo "Invalid verify source checkout." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out protected verify control
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .release-control
          persist-credentials: false
          sparse-checkout: |
            scripts/check_registry_publication.py
            scripts/check_release_metadata.py
            scripts/release_metadata_dotnet.py
            scripts/real_user_swiftpm_public_smoke.sh
            scripts/release_artifact_receipt.py
            scripts/validate_fixtures.py
            scripts/check_sdk_parity.py
            fixtures/valid-batch.json
          sparse-checkout-cone-mode: false

      - name: Bind protected verify control
        shell: bash
        env:
          RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
          RELEASE_SOURCE_SHA: ${{ steps.verify-source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          control_root="$GITHUB_WORKSPACE/.release-control"
          if [[ ! "$RELEASE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ || ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid verify checkout binding." >&2
            exit 1
          fi
          actual_source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          actual_control_sha="$(git -C "$control_root" rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual_source_sha" != "$RELEASE_SOURCE_SHA" || "$actual_control_sha" != "$RELEASE_CONTROL_SHA" ]]; then
            echo "Verify checkout binding mismatch." >&2
            exit 1
          fi
          control_files=(
            scripts/check_registry_publication.py
            scripts/check_release_metadata.py
            scripts/release_metadata_dotnet.py
            scripts/real_user_swiftpm_public_smoke.sh
            scripts/release_artifact_receipt.py
            scripts/validate_fixtures.py
            scripts/check_sdk_parity.py
            fixtures/valid-batch.json
          )
          for relative_path in "${control_files[@]}"; do
            control_path="$control_root/$relative_path"
            if [[ ! -f "$control_path" || -L "$control_path" ]]; then
              echo "Protected verify control is incomplete." >&2
              exit 1
            fi
          done
          if ! git -C "$control_root" diff --quiet HEAD -- "${control_files[@]}"; then
            echo "Protected verify control changed." >&2
            exit 1
          fi

      - name: Verify public Swift products
        shell: bash
        env:
          VERIFY_SWIFTPM_VERSION: ${{ inputs.verify_swiftpm_version }}
        run: |
          set -Eeuo pipefail
          : "${VERIFY_SWIFTPM_VERSION:?verify_swiftpm_version is required when include_swiftpm is enabled}"
          release_revision="$(git rev-parse HEAD)"
          release_source_sha256="$(git archive HEAD | shasum -a 256 | awk '{print $1}')"
          export LOGBREW_SWIFTPM_EXPECTED_REVISION="$release_revision"
          export LOGBREW_SWIFTPM_EXPECTED_SOURCE_SHA256="$release_source_sha256"
          bash "$GITHUB_WORKSPACE/.release-control/scripts/real_user_swiftpm_public_smoke.sh" \
            "$VERIFY_SWIFTPM_VERSION"
