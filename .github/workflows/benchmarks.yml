name: Benchmarks

# Checks that the benchmarks in benchmarks/ still run. It does not check their results.
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Run the benchmarks in quick mode
        run: bash benchmarks/run.sh --quick
