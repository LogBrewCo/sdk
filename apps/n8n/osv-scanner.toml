# Reviewed exceptions for advisories in this package's development tools.
#
# n8n rejects an "overrides" or "resolutions" field in a community node's
# package.json (lint rule @n8n/community-nodes/no-overrides-field), so this
# package cannot pin a fixed version below its tools. None of these packages is
# a runtime dependency: the package ships only dist/, and n8n provides
# n8n-workflow. Remove an entry when @n8n/node-cli or n8n-workflow moves to a
# fixed version, and check each entry again before it expires.

